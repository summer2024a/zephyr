# GMAC 可选叠加（默认已编入 he200_ep_defconfig / build_he200_ep_final）
# 仅当需要覆盖 defconfig 中的网络项时再使用：
# west build -b he200_ep -d build_he200_ep_final app_shell_fs -- \
#   -DEXTRA_CONF_FILE=../zephyr/boards/lynxi/he200_ep/he200_ep_gmac.conf

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
# zperf TCP 需 2 个 listen + MAX_SESSIONS 个 accept fd；与 UDP service 合计需 >=9
CONFIG_ZVFS_POLL_MAX=9
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_GPIO=y
CONFIG_GPIO_DW=y
CONFIG_ETH_DWMAC_LYNXI_KA200=y
CONFIG_MDIO=y
# PHY 型号实板鉴定前用通用 MII；读到 ID 后再换 realtek,rtl8211f 等专用 binding
CONFIG_PHY_GENERIC_MII=y
CONFIG_DCACHE_LINE_SIZE=64
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_PHY_LOG_LEVEL_INF=y
CONFIG_MDIO_LOG_LEVEL_INF=y
CONFIG_PHY_AUTONEG_TIMEOUT_MS=10000

# eth → mdio → phy（避免 PHY MDIO 在 GMAC 时钟未开时死等）
CONFIG_ETH_INIT_PRIORITY=55
CONFIG_MDIO_INIT_PRIORITY=56
CONFIG_PHY_INIT_PRIORITY=57

# 网络 Shell + 静态 IP（直连 Host enp25s0f1 @ 192.168.1.1/24）
CONFIG_NET_SHELL=y
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.1"
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_BUF_DATA_SIZE=1518
CONFIG_DWMAC_NB_RX_DESCS=32
CONFIG_DWMAC_NB_TX_DESCS=16
CONFIG_NET_STATISTICS=y
CONFIG_NET_MGMT_EVENT=y
